<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcul Tonnage</title>

<meta name="app-version" content="1.0.0">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#000;
  color:#fff;
  padding:10px;
}

h1{
  text-align:center;
  margin:10px 0;
  font-size:20px;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  font-size:18px;
  border-radius:8px;
  border:none;
  outline:none;
}

#area{
  text-align:center;
  font-size:18px;
  opacity:0.8;
  margin-top:10px;
}

#t{
  font-size:54px;
  text-align:center;
  margin-top:12px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:22px;
  opacity:0.7;
  margin-top:4px;
}

#version{
  text-align:center;
  font-size:12px;
  opacity:0.4;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>CALCUL TONNAGE</h1>

<input id="L" type="number" placeholder="Longueur (m)">
<input id="l" type="number" placeholder="Largeur (m)">
<input id="e" type="number" placeholder="Épaisseur (cm)">
<input id="q" type="number" value="1" placeholder="Quantité">

<div id="area">0 m²</div>
<div id="t">0.00 t</div>
<div id="kg">0 kg</div>

<div id="version">v1.0.0</div>

<script>
function calc(){

  const L = Number(Linput.value) || 0;
  const l = Number(linput.value) || 0;
  const e = Number(einput.value) || 0;
  const q = Number(qinput.value) || 1;

  const surface = L * l;
  const tonnage = L * l * (e / 100) * 2.7 * q;
  const kg = tonnage * 1000;

  area.textContent = surface.toFixed(2) + " m²";
  t.textContent = tonnage.toFixed(2) + " t";
  kgEl.textContent = Math.round(kg) + " kg";
}

const Linput = document.getElementById("L");
const linput = document.getElementById("l");
const einput = document.getElementById("e");
const qinput = document.getElementById("q");

const area = document.getElementById("area");
const t = document.getElementById("t");
const kgEl = document.getElementById("kg");

document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("input", calc);
});

window.addEventListener("load", calc);
</script>

</body>
</html>
