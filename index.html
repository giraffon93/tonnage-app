<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcul Tonnage</title>

<meta name="app-version" content="1.0.0">

<link rel="manifest" href="manifest.json">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#000;
  color:#fff;
  padding:10px;
}

h1{
  text-align:center;
  margin:8px 0;
  font-size:20px;
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  font-size:18px;
  border-radius:8px;
  border:none;
}

#area{
  text-align:center;
  font-size:20px;
  opacity:0.8;
  margin-top:8px;
}

#t{
  font-size:52px;
  text-align:center;
  margin-top:12px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:22px;
  opacity:0.7;
  margin-top:4px;
}
</style>
</head>

<body>

<h1>CALCUL TONNAGE</h1>

<input id="L" type="number" placeholder="Longueur (m)">
<input id="l" type="number" placeholder="Largeur (m)">
<input id="e" type="number" placeholder="Épaisseur (cm)">
<input id="q" type="number" value="1" placeholder="Quantité">

<div id="area">0 m²</div>
<div id="t">0.00 t</div>
<div id="kg">0 kg</div>

<script>
function calc(){

  const L = +document.getElementById('L').value || 0;
  const l = +document.getElementById('l').value || 0;
  const e = +document.getElementById('e').value || 0;
  const q = +document.getElementById('q').value || 1;

  const surface = L * l;
  const tonnage = L * l * (e / 100) * 2.7 * q;
  const kg = tonnage * 1000;

  document.getElementById('area').textContent = surface.toFixed(2) + " m²";
  document.getElementById('t').textContent = tonnage.toFixed(2) + " t";
  document.getElementById('kg').textContent = Math.round(kg) + " kg";
}

// calcul live
document.querySelectorAll("input").forEach(i=>{
  i.addEventListener("input", calc);
});

window.addEventListener("load", calc);
</script>

<script>
/* SERVICE WORKER */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {

    const reg = await navigator.serviceWorker.register('./service-worker.js');

    // force check update à chaque ouverture
    reg.update();
  });
}

/* AUTO UPDATE VERSION CHECK */
(async function () {

  const currentVersion = document.querySelector('meta[name="app-version"]').content;
  const storedVersion = localStorage.getItem("app_version");

  if (!storedVersion) {
    localStorage.setItem("app_version", currentVersion);
    return;
  }

  if (storedVersion !== currentVersion) {

    if ('caches' in window) {
      const keys = await caches.keys();
      for (const key of keys) {
        await caches.delete(key);
      }
    }

    localStorage.setItem("app_version", currentVersion);
    location.reload();
  }

})();
</script>

</body>
</html>
