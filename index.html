<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcul Tonnage</title>
<meta name="app-version" content="1.0.8">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tonnage">
<link rel="apple-touch-icon" href="icon.png">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#000;
  color:#fff;
  padding:10px;
}

h1{
  text-align:center;
  margin:10px 0;
  font-size:20px;
}

input, select{
  width:100%;
  padding:12px;
  margin:6px 0;
  font-size:18px;
  border-radius:8px;
  border:none;
  outline:none;
}

#area{
  text-align:center;
  font-size:18px;
  opacity:0.8;
  margin-top:10px;
}

#t{
  font-size:54px;
  text-align:center;
  margin-top:12px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:22px;
  opacity:0.7;
  margin-top:4px;
}

#version{
  text-align:center;
  font-size:12px;
  opacity:0.4;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>CALCUL TONNAGE</h1>

<input id="L" type="text" inputmode="decimal" placeholder="Longueur (m)">
<input id="l" type="text" inputmode="decimal" placeholder="Largeur (m)">
<input id="e" type="text" inputmode="decimal" placeholder="Épaisseur (cm)">

<select id="q">
  <option value="" disabled selected>Nombre de tranches</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
  <option value="6">6</option>
  <option value="7">7</option>
  <option value="8">8</option>
  <option value="9">9</option>
  <option value="10">10</option>
</select>

<div id="area">0 m²</div>
<div id="t">0.00 t</div>
<div id="kg">0 kg</div>

<div id="version"></div>

<script>
function calc(){
  const L = parseFloat(document.getElementById('L').value.replace(",", ".")) || 0;
  const l = parseFloat(document.getElementById('l').value.replace(",", ".")) || 0;
  const e = parseFloat(document.getElementById('e').value.replace(",", ".")) || 0;
  const q = parseFloat(document.getElementById('q').value) || 0;

  const surface_unitaire = L * l;
  const surface_totale = surface_unitaire * q;

  const tonnage = surface_totale * (e / 100) * 2.7;
  const kg = tonnage * 1000;

  document.getElementById('area').textContent = surface_totale.toFixed(2) + " m²";
  document.getElementById('t').textContent = tonnage.toFixed(2) + " t";
  document.getElementById('kg').textContent = Math.round(kg).toLocaleString() + " kg";
}

document.getElementById("q").addEventListener("change", () => {
  const q = document.getElementById("q").value;
  document.getElementById("q").options[0].textContent = "Nombre de tranches : " + q;
  calc();
});

document.querySelectorAll("input, select").forEach(el=>{
  el.addEventListener("input", calc);
});

window.addEventListener("load", calc);

document.getElementById("version").textContent =
  "Version " + document.querySelector('meta[name="app-version"]').content;

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
