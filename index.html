<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calcul Tonnage</title>
<meta name="app-version" content="1.0.2">

<style>
body{
  margin:0;
  font-family: Arial;
  background:#000;
  color:#fff;
  padding:10px;
}

h1{
  text-align:center;
  margin:10px 0;
  font-size:20px;
}

input, select{
  width:100%;
  padding:12px;
  margin:6px 0;
  font-size:18px;
  border-radius:8px;
  border:none;
  outline:none;
}

/* Résultats */
#area{
  text-align:center;
  font-size:18px;
  opacity:0.8;
  margin-top:10px;
}

#t{
  font-size:54px;
  text-align:center;
  margin-top:12px;
  color:#00ff99;
  font-weight:bold;
}

#kg{
  text-align:center;
  font-size:22px;
  opacity:0.7;
  margin-top:4px;
}

#version{
  text-align:center;
  font-size:12px;
  opacity:0.4;
  margin-top:15px;
}

/* CLAVIER NUMÉRIQUE */
#numpad {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 20px;
}

.nkey {
  background: #222;
  color: #fff;
  padding: 18px 0;
  text-align: center;
  font-size: 22px;
  border-radius: 10px;
  user-select: none;
}

.nkey:active {
  background: #444;
}
</style>
</head>

<body>

<h1>CALCUL TONNAGE</h1>

<!-- Inputs -->
<input id="L" type="text" placeholder="Longueur (m)">
<input id="l" type="text" placeholder="Largeur (m)">
<input id="e" type="text" placeholder="Épaisseur (cm)">

<select id="q">
  <option value="1">Quantité : 1</option>
  <option value="2">Quantité : 2</option>
  <option value="3">Quantité : 3</option>
  <option value="4">Quantité : 4</option>
  <option value="5">Quantité : 5</option>
  <option value="6">Quantité : 6</option>
  <option value="7">Quantité : 7</option>
  <option value="8">Quantité : 8</option>
  <option value="9">Quantité : 9</option>
  <option value="10">Quantité : 10</option>
</select>

<!-- Résultats -->
<div id="area">0 m²</div>
<div id="t">0.00 t</div>
<div id="kg">0 kg</div>

<!-- CLAVIER NUMÉRIQUE STYLE iOS -->
<div id="numpad">
  <div class="nkey">7</div>
  <div class="nkey">8</div>
  <div class="nkey">9</div>
  <div class="nkey" data-action="del">⌫</div>

  <div class="nkey">4</div>
  <div class="nkey">5</div>
  <div class="nkey">6</div>
  <div class="nkey" data-action="next">→</div>

  <div class="nkey">1</div>
  <div class="nkey">2</div>
  <div class="nkey">3</div>
  <div class="nkey" data-action="enter">↵</div>

  <div class="nkey">-</div>
  <div class="nkey">0</div>
  <div class="nkey">,</div>
  <div class="nkey" data-action="clear">C</div>
</div>

<div id="version"></div>

<script>
function calc(){
  const L = parseFloat(document.getElementById('L').value.replace(",", ".")) || 0;
  const l = parseFloat(document.getElementById('l').value.replace(",", ".")) || 0;
  const e = parseFloat(document.getElementById('e').value.replace(",", ".")) || 0;
  const q = +document.getElementById('q').value || 1;

  const surface = L * l;
  const tonnage = surface * (e / 100) * 2.7 * q;
  const kg = tonnage * 1000;

  document.getElementById('area').textContent = surface.toFixed(2) + " m²";
  document.getElementById('t').textContent = tonnage.toFixed(2) + " t";
  document.getElementById('kg').textContent = Math.round(kg).toLocaleString() + " kg";
}

document.querySelectorAll("input, select").forEach(el=>{
  el.addEventListener("input", calc);
});

window.addEventListener("load", calc);

// VERSION
document.getElementById("version").textContent =
  "Version " + document.querySelector('meta[name=\"app-version\"]').content;


// CLAVIER NUMÉRIQUE
let activeInput = null;

document.querySelectorAll("input").forEach(inp => {
  inp.addEventListener("focus", () => activeInput = inp);
});

document.querySelectorAll(".nkey").forEach(key => {
  key.addEventListener("click", () => {

    if (!activeInput) return;

    const action = key.dataset.action;

    if (!action) {
      activeInput.value += key.textContent;
    } 
    else if (action === "del") {
      activeInput.value = activeInput.value.slice(0, -1);
    }
    else if (action === "clear") {
      activeInput.value = "";
    }
    else if (action === "next") {
      const inputs = [...document.querySelectorAll("input")];
      let i = inputs.indexOf(activeInput);
      if (i < inputs.length - 1) inputs[i + 1].focus();
    }
    else if (action === "enter") {
      activeInput.blur();
    }

    calc();
  });
});
</script>

</body>
</html>
